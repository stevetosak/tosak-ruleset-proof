name: bump

# Plays the app CI: an App token, a deploy branch, a PR, auto-merge.
# Commits go through the contents API so GitHub signs them as the App.
on:
  workflow_dispatch:
    inputs:
      extra:
        description: Also change README.md (T4, the check must refuse)
        type: boolean
        default: false

permissions: {}

jobs:
  bump:
    runs-on: ubuntu-24.04
    steps:
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/github-script@v7
        env:
          EXTRA: ${{ inputs.extra }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const n = context.runNumber;
            const branch = `deploy/test-${n}`;
            const tag = `test-${n}`;

            const main = await github.rest.git.getRef({ ...repo, ref: 'heads/main' });
            await github.rest.git.createRef({ ...repo, ref: `refs/heads/${branch}`, sha: main.data.object.sha });

            async function rewrite(path, change, message) {
              const cur = await github.rest.repos.getContent({ ...repo, path, ref: branch });
              const text = Buffer.from(cur.data.content, 'base64').toString();
              await github.rest.repos.createOrUpdateFileContents({
                ...repo, path, branch, message, sha: cur.data.sha,
                content: Buffer.from(change(text)).toString('base64'),
              });
            }

            await rewrite('overlays/dev/kustomization.yaml',
              t => t.replace(/newTag: .*/, `newTag: ${tag}`), `deploy: proof ${tag}`);
            if (process.env.EXTRA === 'true') {
              await rewrite('README.md', t => t + `\nExtra line from run ${n}.\n`, `extra: README ${n}`);
            }

            const pr = await github.rest.pulls.create({ ...repo, head: branch, base: 'main', title: `deploy: proof ${tag}` });
            core.info(`PR #${pr.data.number}`);
            await github.graphql(
              `mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) { clientMutationId } }`,
              { id: pr.data.node_id });
            core.info('Auto-merge enabled.');
